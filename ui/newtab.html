<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title></title>
<link rel="stylesheet" href="fonts/noto-sans-jp/index.css">
<style>
  @font-face {
    font-family: "Geist";
    src: url("fonts/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: #fff; color: #111;
    font: 16px/1.5 "Geist", "Noto Sans JP Variable", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  form { width: min(460px, 80vw); margin-top: -14vh; }
  input {
    width: 100%; height: 42px; padding: 0 18px; box-sizing: border-box; font-size: 14.5px !important;
    border-radius: 999px; border: 1px solid #e5e5e5; background: #fff;
    color: inherit; font: inherit; outline: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    transition: border-color .12s, box-shadow .12s;
  }
  input:hover { border-color: #d4d4d4; }
  input:focus { border-color: #c4c4c4; box-shadow: 0 2px 10px rgba(0, 0, 0, .06); }
  input::placeholder { color: #a3a3a3; }
  #stats { margin: 16px 0 0; text-align: center; font-size: 12.5px; color: #8a8a8a; letter-spacing: .01em; }
  #stats b { color: #111; font-weight: 600; font-variant-numeric: tabular-nums; }
  :root[data-theme="dark"] #stats b { color: #ededed; }
  #private-note { margin: 14px 0 0; text-align: center; font-size: 12.5px; color: #8a8a8a; }
  :root[data-theme="dark"] {
    & body { background: #161616; color: #ededed; }
    & input { background: #1b1b1b; border-color: #2a2a2a; box-shadow: none; }
    & input:hover { border-color: #3a3a3a; }
    & input:focus { border-color: #444; box-shadow: 0 2px 10px rgba(0, 0, 0, .4); }
    & input::placeholder { color: #6e6e6e; }
  }
</style>
</head>
<body>
  <form id="f">
    <input id="q" data-i18n-placeholder="nt.placeholder" autofocus spellcheck="false" autocomplete="off">
    <p id="private-note" data-i18n="nt.private" hidden></p>
    <p id="stats" hidden></p>
  </form>
  <script src="i18n.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
