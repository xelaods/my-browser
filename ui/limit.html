<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title></title>
<link rel="stylesheet" href="fonts/noto-sans-jp/index.css">
<style>
  @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: #fafafa; color: #111;
    font: 15px/1.6 "Geist", "Noto Sans JP Variable", sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: min(440px, 86vw); text-align: center; margin-top: -8vh; }
  .ring {
    width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 50%;
    background: conic-gradient(#7c3aed 0 100%); display: grid; place-items: center;
  }
  .ring::after { content: ""; width: 56px; height: 56px; border-radius: 50%; background: #fafafa; }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  p { margin: 0 0 26px; color: #6b6b6b; }
  .buttons { display: flex; gap: 10px; justify-content: center; }
  button {
    height: 38px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
    border: 1px solid #e5e5e5; background: #fff; color: #111;
  }
  button.primary { background: #111; color: #fff; border-color: #111; }
  :root[data-theme="dark"] {
    & body { background: #161616; color: #ededed; }
    & .ring::after { background: #161616; }
    & p { color: #a1a1a1; }
    & button { background: #1b1b1b; border-color: #2a2a2a; color: #ededed; }
    & button.primary { background: #ededed; color: #111; border-color: #ededed; }
  }
</style>
</head>
<body>
  <main>
    <div class="ring"></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="buttons">
      <button id="more"></button>
      <button id="close" class="primary"></button>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="limit.js"></script>
</body>
</html>
