<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>glance</title>
<link rel="stylesheet" href="fonts/noto-sans-jp/index.css">
<link rel="stylesheet" href="glance.css">
</head>
<body>
  <!-- リンクのプレビュー（Alt+クリック）：ページの上に大きく浮かべる。外をクリックか Esc で閉じる -->
  <div id="dim"></div>
  <div id="frame"></div>
  <div id="bar">
    <div id="info">
      <span id="spin"></span>
      <svg viewBox="0 0 24 24" id="mask"><path d="M3 11h18"/><path d="M6 11l1.6-5.2a1 1 0 0 1 1-.7h6.8a1 1 0 0 1 1 .7L18 11"/><circle cx="8" cy="16" r="2.6"/><circle cx="16" cy="16" r="2.6"/><path d="M10.6 16h2.8"/></svg>
      <b id="host"></b><span id="title"></span>
    </div>
    <div class="buttons">
      <button id="split" class="pill"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M12 5v14"/></svg><span data-i18n="glance.split"></span></button>
      <button id="tab" class="pill"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-7 7"/><path d="M10 20H4v-6"/><path d="M4 20l7-7"/></svg><span data-i18n="glance.openTab"></span></button>
      <button id="close" class="round" data-i18n-title="common.closeEsc"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="glance.js"></script>
</body>
</html>
