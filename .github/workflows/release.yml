# package.json の version を上げて main に push すると（または v0.4.0 のようなタグを push すると）、
# Windows 用のインストーラーを作って GitHub Releases に公開する。
# 公開したインストーラーは、インストール済みのアプリが自動アップデートで取りに来る
name: release
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # すでに同じバージョンを公開していたら何もしない（途中で失敗したものは作り直す）
      - name: check version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          assets="$(gh release view "$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if echo "$assets" | grep -qx latest.yml; then echo "skip=1" >> "$GITHUB_OUTPUT";
          elif [ -n "$assets" ]; then
            # 途中で失敗した公開（自動アップデート用の latest.yml が無い）は消して作り直す
            gh release delete "$v" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ver.outputs.skip != '1'
      - name: build and publish
        if: steps.ver.outputs.skip != '1'
        shell: bash
        # 失敗したときは、最後の行をエラー表示（annotation）に出す
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish always 2>&1 | tee build.log || { grep -E "⨯|rror|\"message\"|statusCode|status code|publish" build.log | grep -v "^\s*\"x-" | tail -n 9 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # コード署名する場合は、証明書を Secrets に登録して次の2行を有効にする
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
