# package.json の version を上げて main に push すると（または v0.4.0 のようなタグを push すると）、
# Windows 用のインストーラーを作って GitHub Releases に公開する。
# 公開したインストーラーは、インストール済みのアプリが自動アップデートで取りに来る
name: release
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # すでに同じバージョンをきちんと公開していたら何もしない。
      # 途中で失敗したもの（latest.yml が無い・同じタグのリリースが2つある）は消して作り直す
      - name: check version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          ids="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name==\"$v\") | .id")"
          n="$(echo "$ids" | grep -c . || true)"
          ok="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name==\"$v\") | .assets[].name] | (index(\"latest.yml\") != null) and (map(endswith(\".blockmap\")) | any)")"
          if [ "$n" = "1" ] && [ "$ok" = "true" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$v" 2>/dev/null || true
          # 先にリリースを1つだけ作っておく（electron-builder が同時に2つ作ってしまうのを防ぐ）
          gh release create "$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "My Browser ${v#v}" --notes "My Browser ${v#v}" --draft
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ver.outputs.skip != '1'
      - name: build and publish
        if: steps.ver.outputs.skip != '1'
        shell: bash
        # 失敗したときは、最後の行をエラー表示（annotation）に出す
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish always 2>&1 | tee build.log &&
          gh release edit "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest || { grep -E "⨯|rror|\"message\"|statusCode|status code|publish" build.log | grep -v "^\s*\"x-" | tail -n 9 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # コード署名する場合は、証明書を Secrets に登録して次の2行を有効にする
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
